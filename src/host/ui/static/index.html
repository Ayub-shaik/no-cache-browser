<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCB</title>
  <style>
    :root {
      --bg: #1a1d23;
      --pane: #242830;
      --border: #3a4050;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #5b8def;
      --on: #3dd68c;
      --danger: #f07178;
      --tab: #2a2f3a;
      --tab-active: #3a4560;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .tabs {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 6px 8px 0;
      background: #15181e;
      border-bottom: 1px solid var(--border);
      min-height: 34px;
      overflow-x: auto;
    }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: 180px;
      padding: 6px 8px 6px 10px;
      background: var(--tab);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }
    .tab.active {
      background: var(--tab-active);
      color: var(--text);
      border-color: var(--accent);
    }
    .tab .label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
      min-width: 0;
    }
    .tab .x {
      border: none;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      padding: 0 2px;
      font-size: 12px;
      line-height: 1;
    }
    .tab .x:hover { color: var(--danger); }
    .tab-add {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 8px 8px 0 0;
      color: var(--muted);
      padding: 4px 10px;
      cursor: pointer;
    }
    .tab-add:hover { border-color: var(--accent); color: var(--accent); }
    .top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--pane);
      border-bottom: 1px solid var(--border);
      min-height: 48px;
    }
    .brand {
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent);
      padding: 0 6px;
      user-select: none;
    }
    .nav-btn, .go-btn {
      background: #2e3440;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }
    .nav-btn:hover, .go-btn:hover { border-color: var(--accent); }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }
    #url {
      flex: 1;
      min-width: 120px;
      background: #12151a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 7px 10px;
      outline: none;
    }
    #url:focus { border-color: var(--accent); }
    .toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 8px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #12151a;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .toggle .knob {
      width: 34px;
      height: 18px;
      border-radius: 999px;
      background: #3a4050;
      position: relative;
      transition: background 0.15s;
    }
    .toggle .knob::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }
    .toggle.on .knob { background: var(--on); }
    .toggle.on .knob::after { transform: translateX(16px); }
    .toggle-label { color: var(--muted); font-size: 12px; }
    .toggle.on .toggle-label { color: var(--on); }
    #status {
      padding: 6px 12px;
      color: var(--muted);
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }
    #hint {
      padding: 8px 12px;
      color: var(--muted);
      max-width: 42rem;
      display: none; /* product window is self-explanatory once DevEx dock is up */
    }
    .devex {
      display: flex;
      flex-direction: column;
      height: calc(100% - 120px);
      min-height: 220px;
      border-top: 1px solid var(--border);
      background: #12151a;
    }
    .devex-bar {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      background: var(--pane);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .devex-tab {
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .devex-tab.active {
      color: var(--text);
      border-color: var(--accent);
      background: #2a3142;
    }
    .devex-actions {
      margin-left: auto;
      display: flex;
      gap: 6px;
    }
    .devex-actions button {
      background: #2e3440;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .devex-actions button:hover { border-color: var(--accent); }
    .devex-actions button.primary {
      border-color: var(--accent);
      color: var(--accent);
    }
    .devex-body {
      flex: 1;
      overflow: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 11px;
      line-height: 1.45;
    }
    .devex-pane { display: none; padding: 4px 0; }
    .devex-pane.active { display: block; }
    .log-row {
      display: grid;
      grid-template-columns: 64px 56px 1fr;
      gap: 8px;
      padding: 2px 10px;
      border-bottom: 1px solid #1c2028;
    }
    .log-row:hover { background: #1a1f28; }
    .log-row .lvl { color: var(--muted); text-transform: uppercase; font-size: 10px; }
    .log-row.level-error .lvl, .log-row.level-error .msg { color: var(--danger); }
    .log-row.level-warn .lvl, .log-row.level-warn .msg { color: #e6c07b; }
    .log-row .ts { color: #6b7280; }
    .log-row .msg { color: var(--text); word-break: break-word; white-space: pre-wrap; }
    .net-row {
      display: grid;
      grid-template-columns: 52px 48px 1fr;
      gap: 8px;
      padding: 2px 10px;
      border-bottom: 1px solid #1c2028;
    }
    .net-row:hover { background: #1a1f28; }
    .net-row .method { color: var(--accent); font-weight: 600; }
    .net-row .status { color: var(--muted); }
    .net-row .status.ok { color: var(--on); }
    .net-row .status.bad { color: var(--danger); }
    .net-row .url { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty {
      padding: 16px 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="tabs" id="tabs" role="tablist" aria-label="NCB tabs"></div>
  <div class="top" role="banner">
    <div class="brand" title="No Cache Browser">NCB</div>
    <button type="button" class="nav-btn" id="back" title="Back">←</button>
    <button type="button" class="nav-btn" id="forward" title="Forward">→</button>
    <button type="button" class="nav-btn" id="duplicate" title="Duplicate tab (same session — cookies carry over)">⧉</button>
    <input id="url" type="text" spellcheck="false" autocomplete="off" placeholder="https://…" />
    <button type="button" class="go-btn" id="go">Go</button>
    <div class="toggle" id="toggle" role="switch" aria-checked="false" title="Save nothing: ephemeral session + HTTP cache off + SW bypass">
      <div class="knob" aria-hidden="true"></div>
      <span class="toggle-label">No-cache / Save nothing</span>
    </div>
  </div>
  <div id="status">Connecting…</div>
  <div id="hint">
    NCB product window — tabs, address, save-nothing toggle, and DevEx dock below.
  </div>
  <section class="devex" id="devex" aria-label="Developer tools">
    <div class="devex-bar">
      <button type="button" class="devex-tab active" data-pane="console" id="tab-console">Console</button>
      <button type="button" class="devex-tab" data-pane="network" id="tab-network">Network</button>
      <div class="devex-actions">
        <button type="button" id="btn-clear" title="Clear captured console and network">Clear</button>
        <button type="button" id="btn-har" title="Export HAR 1.2">Export HAR</button>
        <button type="button" class="primary" id="btn-session" title="Export ncb-session.json">Export session</button>
      </div>
    </div>
    <div class="devex-body">
      <div class="devex-pane active" id="pane-console"><div class="empty" id="console-empty">No console messages yet.</div><div id="console-list"></div></div>
      <div class="devex-pane" id="pane-network"><div class="empty" id="network-empty">No network requests yet.</div><div id="network-list"></div></div>
    </div>
  </section>
  <script>
    const urlEl = document.getElementById("url");
    const statusEl = document.getElementById("status");
    const toggleEl = document.getElementById("toggle");
    const tabsEl = document.getElementById("tabs");
    const consoleList = document.getElementById("console-list");
    const networkList = document.getElementById("network-list");
    const consoleEmpty = document.getElementById("console-empty");
    const networkEmpty = document.getElementById("network-empty");
    let ws;
    let noCacheEnabled = false;
    let activePane = "console";

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function shortLabel(tab) {
      const raw = (tab.title || tab.url || tab.id || "").trim();
      try {
        if (raw.startsWith("http")) return new URL(raw).hostname || raw;
      } catch (_) { /* ignore */ }
      return raw.length > 28 ? raw.slice(0, 26) + "…" : raw || "Tab";
    }

    function renderTabs(tabs) {
      tabsEl.innerHTML = "";
      (tabs || []).forEach((tab) => {
        const el = document.createElement("div");
        el.className = "tab" + (tab.active ? " active" : "");
        el.setAttribute("role", "tab");
        el.setAttribute("aria-selected", String(!!tab.active));
        el.title = tab.url || tab.id;

        const label = document.createElement("span");
        label.className = "label";
        label.textContent = shortLabel(tab);
        el.appendChild(label);

        const x = document.createElement("button");
        x.type = "button";
        x.className = "x";
        x.title = "Close tab";
        x.textContent = "×";
        x.onclick = (ev) => {
          ev.stopPropagation();
          send({ type: "close-tab", tabId: tab.id });
        };
        el.appendChild(x);

        el.onclick = () => {
          if (!tab.active) send({ type: "activate-tab", tabId: tab.id });
        };
        tabsEl.appendChild(el);
      });

      const add = document.createElement("button");
      add.type = "button";
      add.className = "tab-add";
      add.title = "Duplicate active tab (same session)";
      add.textContent = "+";
      add.onclick = () => send({ type: "duplicate" });
      tabsEl.appendChild(add);
    }

    function applyState(state) {
      if (typeof state.url === "string") urlEl.value = state.url;
      if (typeof state.noCacheEnabled === "boolean") {
        noCacheEnabled = state.noCacheEnabled;
        toggleEl.classList.toggle("on", noCacheEnabled);
        toggleEl.setAttribute("aria-checked", String(noCacheEnabled));
      }
      if (typeof state.status === "string") setStatus(state.status);
      if (Array.isArray(state.tabs)) renderTabs(state.tabs);
    }

    function send(msg) {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(msg));
      }
    }

    function fmtTime(ts) {
      try {
        const d = new Date(ts);
        return d.toLocaleTimeString(undefined, { hour12: false });
      } catch (_) {
        return "";
      }
    }

    function renderDevEx(snap) {
      const cons = snap.console || [];
      const nets = snap.network || [];
      consoleEmpty.style.display = cons.length ? "none" : "block";
      networkEmpty.style.display = nets.length ? "none" : "block";
      consoleList.innerHTML = cons.map((row) => {
        const lvl = (row.level || "log").toLowerCase();
        return '<div class="log-row level-' + lvl + '">' +
          '<span class="ts">' + fmtTime(row.timestamp) + '</span>' +
          '<span class="lvl">' + lvl + '</span>' +
          '<span class="msg"></span></div>';
      }).join("");
      Array.from(consoleList.querySelectorAll(".msg")).forEach((el, i) => {
        el.textContent = cons[i].text || "";
      });
      networkList.innerHTML = nets.map((row) => {
        const st = row.status;
        let cls = "";
        let label = "…";
        if (row.errorText) { cls = "bad"; label = "ERR"; }
        else if (st === null || st === undefined) { label = "…"; }
        else { cls = st >= 400 ? "bad" : "ok"; label = String(st); }
        return '<div class="net-row">' +
          '<span class="method"></span>' +
          '<span class="status ' + cls + '">' + label + '</span>' +
          '<span class="url"></span></div>';
      }).join("");
      Array.from(networkList.querySelectorAll(".method")).forEach((el, i) => {
        el.textContent = nets[i].method || "GET";
      });
      Array.from(networkList.querySelectorAll(".url")).forEach((el, i) => {
        el.textContent = nets[i].url || "";
        el.title = nets[i].url || "";
      });
      document.getElementById("tab-console").textContent =
        "Console" + (snap.consoleCount ? " (" + snap.consoleCount + ")" : "");
      document.getElementById("tab-network").textContent =
        "Network" + (snap.networkCount ? " (" + snap.networkCount + ")" : "");
    }

    function setPane(name) {
      activePane = name;
      document.querySelectorAll(".devex-tab").forEach((b) => {
        b.classList.toggle("active", b.getAttribute("data-pane") === name);
      });
      document.querySelectorAll(".devex-pane").forEach((p) => {
        p.classList.toggle("active", p.id === "pane-" + name);
      });
    }

    function connect() {
      const proto = location.protocol === "https:" ? "wss" : "ws";
      ws = new WebSocket(proto + "://" + location.host + "/ws");
      ws.onopen = () => setStatus("Connected");
      ws.onclose = () => {
        setStatus("Disconnected — retrying…");
        setTimeout(connect, 800);
      };
      ws.onerror = () => setStatus("WebSocket error");
      ws.onmessage = (ev) => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === "state") applyState(msg);
          else if (msg.type === "devex") renderDevEx(msg);
          else if (msg.type === "export-done") {
            setStatus("Exported " + msg.kind + ": " + msg.file);
          }
        } catch (_) { /* ignore */ }
      };
    }

    document.getElementById("go").onclick = () => send({ type: "navigate", url: urlEl.value });
    urlEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") send({ type: "navigate", url: urlEl.value });
    });
    document.getElementById("back").onclick = () => send({ type: "back" });
    document.getElementById("forward").onclick = () => send({ type: "forward" });
    document.getElementById("duplicate").onclick = () => send({ type: "duplicate" });
    toggleEl.onclick = () => send({ type: "toggle", enabled: !noCacheEnabled });

    document.querySelectorAll(".devex-tab").forEach((btn) => {
      btn.onclick = () => setPane(btn.getAttribute("data-pane"));
    });
    document.getElementById("btn-clear").onclick = () => send({ type: "devex-clear" });
    document.getElementById("btn-har").onclick = () => {
      setStatus("Exporting HAR…");
      send({ type: "export-har" });
    };
    document.getElementById("btn-session").onclick = () => {
      setStatus("Exporting session…");
      send({ type: "export-session" });
    };

    connect();
  </script>
</body>
</html>
